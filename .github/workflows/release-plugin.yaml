name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Top-level plugin directory; its committed package.json supplies the version
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: release-${{ inputs.plugin }}
  cancel-in-progress: false

env:
  PLUGIN: ${{ inputs.plugin }}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release from main so the tag points at reviewed source."
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # previous tags for release notes
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Validate plugin and version
        id: info
        run: node scripts/release-info.mjs "$PLUGIN" | tee -a "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/headlamp-plugin-$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Require an unreleased version
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version in $PLUGIN/package.json and package-lock.json."
            exit 1
          fi

      - name: Build and package
        working-directory: ${{ inputs.plugin }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm ci
          npm run build
          npm run package -- . "$RUNNER_TEMP/release"

      - name: Write release notes
        env:
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          ARCHIVE: ${{ steps.info.outputs.archive }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          test -s "$RUNNER_TEMP/release/$ARCHIVE"
          sha256=$(sha256sum "$RUNNER_TEMP/release/$ARCHIVE" | cut -d' ' -f1)
          previous=$(git tag --list "$PLUGIN-[0-9]*" --sort=-v:refname | head -n1)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' ${previous:+"$previous..HEAD"} -- "$PLUGIN"
            echo
            echo "## Artifacts"
            echo
            echo "- Archive: \`$ARCHIVE\`, SHA256 \`$sha256\`"
            echo "- Image: \`$IMAGE:v$VERSION\`"
          } | tee "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          ARCHIVE: ${{ steps.info.outputs.archive }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/release/$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            --prerelease="$PRERELEASE"

  image:
    name: Container image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Creation time
        id: created
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: PLUGIN=${{ inputs.plugin }}
          tags: |
            ${{ needs.release.outputs.image }}:v${{ needs.release.outputs.version }}
            ${{ needs.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=headlamp-plugin-${{ inputs.plugin }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.authors=jbr-engineering-squad@jetbrains.com
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ inputs.plugin }}
          cache-to: type=gha,mode=max,scope=${{ inputs.plugin }}

      - name: Summary
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: echo "Published \`$IMAGE:v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
