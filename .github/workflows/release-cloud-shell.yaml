name: Publish Cloud Shell image

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-cloud-shell.yaml]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main so the image matches reviewed source."
          exit 1

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-shell
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker buildx build - \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --push \
            --tag "${IMAGE,,}:latest" \
            --label "org.opencontainers.image.title=cloud-shell" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.authors=jbr-engineering-squad@jetbrains.com" <<'EOF'
          FROM cgr.dev/chainguard/kubectl:latest-dev
          ENTRYPOINT []
          CMD ["sleep", "infinity"]
          EOF
