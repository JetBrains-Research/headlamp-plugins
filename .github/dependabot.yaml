version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /applications
      - /cloud-shell
      - /gke-nvidia-gpu
      - /network-policies
      - /themes
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
